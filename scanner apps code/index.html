<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enhanced Text Scanner OCR</title>
  <style>
    :root {
      --primary-color: #4285f4;
      --secondary-color: #34a853;
      --error-color: #ea4335;
      --light-gray: #f5f5f5;
      --dark-gray: #333;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    body {
      background: var(--light-gray);
      color: var(--dark-gray);
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 20px;
    }
    .btn {
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn:hover { background: #3367d6; }
    .btn-secondary { background: var(--secondary-color); }
    .btn-secondary:hover { background: #2d9249; }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    .preview-section {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .preview-box {
      flex: 1;
      min-width: 300px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 10px;
    }
    .preview-title {
      font-weight: bold;
      margin-bottom: 10px;
      color: var(--primary-color);
    }
    #imagePreview, #cropImage {
      max-width: 100%;
      max-height: 300px;
      display: block;
      margin: auto;
    }
    #pdfPreview {
      display: none;
      width: 100%;
      height: 300px;
      border: none;
    }
    #textOutput {
      width: 100%;
      min-height: 300px;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 10px;
      font-family: monospace;
      white-space: pre-wrap;
      resize: vertical;
    }
    .loading {
      display: none;
      text-align: center;
      margin: 20px 0;
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 4px solid rgba(0,0,0,0.1);
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error {
      color: var(--error-color);
      text-align: center;
      margin: 10px 0;
    }
    #cropModal {
      display: none;
      position: fixed;
      top:0;
      left:0;
      right:0;
      bottom:0;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .download-section {
      text-align: center;
      margin-top: 20px;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
</head>
<body>
  <div class="container">
    <h1>Enhanced Text Scanner OCR</h1>
    <div class="btn-group">
      <button id="cameraBtn" class="btn">Open Camera</button>
      <button id="galleryBtn" class="btn btn-secondary">Choose from Gallery</button>
      <button id="pdfBtn" class="btn">Upload PDF</button>
    </div>
    <input type="file" id="captureInput" accept="image/*" capture="environment" style="display:none" />
    <input type="file" id="galleryInput" accept="image/*" style="display:none" />
    <input type="file" id="pdfInput" accept="application/pdf" style="display:none" />

    <div class="loading" id="loadingIndicator"><div class="spinner"></div><p>Processing...</p></div>
    <div class="error" id="errorMessage"></div>
    <div class="preview-section">
      <div class="preview-box">
        <div class="preview-title">Original</div>
        <img id="imagePreview" style="display:none;" />
        <object id="pdfPreview" type="application/pdf" style="display:none; width:100%; height:300px;"></object>
      </div>
      <div class="preview-box">
        <div class="preview-title">Extracted Text</div>
        <textarea id="textOutput" placeholder="Extracted text..."></textarea>
      </div>
    </div>
    <div class="download-section">
      <button id="downloadBtn" class="btn btn-secondary">Download Text</button>
    </div>
  </div>

  <div id="cropModal">
    <div style="background:#fff;padding:20px;border-radius:8px;max-width:90%;max-height:90%;">
      <img id="cropImage" />
      <div style="text-align:right;margin-top:10px;"><button id="cropConfirmBtn" class="btn btn-secondary">Crop & Continue</button></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.5/dist/tesseract.min.js"></script>
  <script>
    const captureInput = document.getElementById('captureInput');
    const galleryInput = document.getElementById('galleryInput');
    const pdfInput = document.getElementById('pdfInput');
    const cameraBtn = document.getElementById('cameraBtn');
    const galleryBtn = document.getElementById('galleryBtn');
    const pdfBtn = document.getElementById('pdfBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const imagePreview = document.getElementById('imagePreview');
    const pdfPreview = document.getElementById('pdfPreview');
    const textOutput = document.getElementById('textOutput');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const errorMessage = document.getElementById('errorMessage');
    const cropModal = document.getElementById('cropModal');
    const cropImage = document.getElementById('cropImage');
    const cropConfirmBtn = document.getElementById('cropConfirmBtn');
    let cropper, globalWorker;

    cameraBtn.onclick = () => captureInput.click();
    galleryBtn.onclick = () => galleryInput.click();
    pdfBtn.onclick = () => pdfInput.click();
    downloadBtn.onclick = () => {
      const text = textOutput.value.trim();
      if (!text) return;
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'extracted_text.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    async function initWorker() {
      if (!globalWorker) {
        globalWorker = Tesseract.createWorker();
        await globalWorker.load();
        await globalWorker.loadLanguage('eng');
        await globalWorker.initialize('eng');
        await globalWorker.setParameters({ tessedit_pageseg_mode: 6 });
      }
    }

    function handleImage(file) {
      const reader = new FileReader();
      reader.onload = () => {
        cropImage.src = reader.result;
        cropModal.style.display = 'flex';
        if (cropper) cropper.destroy();
        cropper = new Cropper(cropImage, { viewMode: 1, autoCropArea: 1 });
      };
      reader.readAsDataURL(file);
    }

    captureInput.onchange = e => e.target.files[0] && handleImage(e.target.files[0]);
    galleryInput.onchange = e => e.target.files[0] && handleImage(e.target.files[0]);
    pdfInput.onchange = async e => {
      const file = e.target.files[0];
      if (!file) return;
      displayPDF(file);
      await processPDFLowRes(file);
    };

    cropConfirmBtn.onclick = () => {
      cropper.getCroppedCanvas().toBlob(async blob => {
        const jpg = new File([blob], 'cropped.jpg', { type: 'image/jpeg' });
        cropper.destroy();
        cropModal.style.display = 'none';
        displayImage(jpg);
        await processImageLowRes(jpg);
      }, 'image/jpeg');
    };

    function displayImage(file) {
      pdfPreview.style.display = 'none';
      imagePreview.style.display = 'block';
      const r = new FileReader();
      r.onload = e => imagePreview.src = e.target.result;
      r.readAsDataURL(file);
    }

    function displayPDF(file) {
      imagePreview.style.display = 'none';
      pdfPreview.style.display = 'block';
      const url = URL.createObjectURL(file);
      pdfPreview.setAttribute('data', url);
    }

    async function processImageLowRes(file) {
      loadingIndicator.style.display = 'block';
      textOutput.value = '';
      errorMessage.textContent = '';
      try {
        await initWorker();
        const img = new Image();
        img.src = URL.createObjectURL(file);
        await img.decode();
        const maxDim = 1600;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const scale = Math.min(maxDim / img.width, maxDim / img.height, 1);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const { data: { text } } = await globalWorker.recognize(canvas);
        textOutput.value = text;
      } catch (err) {
        errorMessage.textContent = 'Error: ' + err.message;
      } finally {
        loadingIndicator.style.display = 'none';
      }
    }

    async function processPDFLowRes(file) {
      loadingIndicator.style.display = 'block';
      textOutput.value = '';
      errorMessage.textContent = '';
      try {
        await initWorker();
        const arr = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument(arr).promise;
        let out = '';
        for (let i = 1; i <= pdf.numPages; i++) {
          const p = await pdf.getPage(i);
          const vp = p.getViewport({ scale: 2.0 });
          const c = document.createElement('canvas');
          c.width = vp.width;
          c.height = vp.height;
          await p.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
          const { data: { text } } = await globalWorker.recognize(c);
          out += text + '\n\n';
        }
        textOutput.value = out;
      } catch (err) {
        errorMessage.textContent = 'Error: ' + err.message;
      } finally {
        loadingIndicator.style.display = 'none';
      }
    }
  </script>
</body>
</html>
